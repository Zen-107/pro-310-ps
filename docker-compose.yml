# Local PostgreSQL for development. Matches DATABASE_URL in .env.example.
#   docker compose up -d db
# The project name is fixed so the container and data volume
# (pro-310-ps-db-1 / pro-310-ps_pgdata) are the same whatever the checkout
# folder is called; otherwise a renamed folder starts a new, empty database.
name: pro-310-ps

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: physio
      POSTGRES_PASSWORD: physio
      POSTGRES_DB: ai_physio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physio -d ai_physio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
