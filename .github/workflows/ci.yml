name: CI

on:
  push:
    branches: [main, ai-physio]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: physio
          POSTGRES_PASSWORD: physio
          POSTGRES_DB: ai_physio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U physio -d ai_physio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://physio:physio@localhost:5432/ai_physio_test?schema=public
      TEST_DATABASE_URL: postgresql://physio:physio@localhost:5432/ai_physio_test?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-not-a-secret
      TTS_PROVIDER: "off"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (app + tests)
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Apply migrations to the test database
        run: bunx prisma migrate deploy

      - name: Integration tests (API + database)
        run: bun run test:integration

      - name: Production build
        run: bun run build
